name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch dependencies
        run: |
          bash fetch-deps.sh
          for d in externals/boost externals/cubeb externals/enet externals/dynarmic externals/teakra; do
            [ -d "$d/.git" ] && git -C "$d" submodule update --init --recursive --depth 1 || true
          done
          ls externals

      - name: Read Gradle version
        run: |
          V=$(grep distributionUrl src/android/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "GRADLE_VERSION=$V" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build release APK
        working-directory: src/android
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../build.log

      - name: Sign APK (throwaway CI key)
        run: |
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=CI"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          mkdir -p out
          find src/android -path "*release*" -name "*.apk" | while read -r f; do
            "$APKSIGNER" sign --ks ci.jks --ks-pass pass:android \
              --out "out/$(basename "${f%.apk}")-signed.apk" "$f"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

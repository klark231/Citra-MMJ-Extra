name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch dependencies
        run: |
          bash fetch-deps.sh
          for d in externals/cubeb externals/enet externals/dynarmic externals/teakra; do
            [ -d "$d/.git" ] && git -C "$d" submodule update --init --recursive --depth 1 || true
          done
          rm -rf externals/boost
          curl -fL https://archives.boost.io/release/1.83.0/source/boost_1_83_0.tar.gz | tar xz
          mv boost_1_83_0 externals/boost
          test -f externals/boost/boost/version.hpp

      - name: Fix cryptopp submodule
        run: |
          cd externals/cryptopp/cryptopp
          git fetch --depth 1 origin master
          git checkout origin/master
          echo "cryptopp now at: $(git rev-parse --short HEAD)"
          ls | grep -i crc

      - name: Patch build files
        run: |
          # --- cryptopp naming: newer master uses crc_simd.cpp, CMakeLists expects crc-simd.cpp ---
          cd externals/cryptopp
          if ls cryptopp/*_simd.cpp >/dev/null 2>&1 && ! ls cryptopp/*-simd.cpp >/dev/null 2>&1; then
            echo ">>> Detected underscore naming, patching cryptopp CMakeLists.txt"
            sed -i 's/-simd\.cpp/_simd.cpp/g' CMakeLists.txt
          fi
          echo "--- cryptopp crc refs ---"
          grep -i "crc" CMakeLists.txt | head -10
          cd ../..

          # --- fmt / dynarmic conflict ---
          sed -i '/^# libfmt/d; /^add_subdirectory(fmt)/d; /^add_library(fmt::fmt ALIAS fmt)/d' externals/CMakeLists.txt
          sed -i '1i add_subdirectory(fmt)' externals/CMakeLists.txt
          echo "# disabled in CI" > externals/dynarmic/externals/fmt/CMakeLists.txt

          # --- Remove dynarmic install/export (multi-line block) ---
          sed -i '/^install(EXPORT dynarmicTargets/,/^)/d' externals/dynarmic/CMakeLists.txt
          sed -i 's/^install(TARGETS dynarmic EXPORT dynarmicTargets)/##&/' externals/dynarmic/CMakeLists.txt

          # --- SoundTouch include path fix ---
          sed -i 's|target_include_directories(SoundTouch INTERFACE \(.*\))|target_include_directories(SoundTouch INTERFACE $<BUILD_INTERFACE:\1>)|' externals/soundtouch/CMakeLists.txt

          # --- sanity check ---
          echo "--- dynarmic install lines after patch ---"
          grep -n 'install' externals/dynarmic/CMakeLists.txt | head -10
          echo "--- soundtouch include line ---"
          grep -n 'target_include_directories(SoundTouch' externals/soundtouch/CMakeLists.txt

      - name: Read Gradle version
        run: |
          V=$(grep distributionUrl src/android/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "GRADLE_VERSION=$V" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build release APK
        working-directory: src/android
        env:
          CI: "0"
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee ../../build.log

      - name: Sign APK (throwaway CI key)
        if: success()
        run: |
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=CI"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          mkdir -p out
          find src/android -path "*release*" -name "*.apk" | while read -r f; do
            "$APKSIGNER" sign --ks ci.jks --ks-pass pass:android \
              --out "out/$(basename "${f%.apk}")-signed.apk" "$f"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log